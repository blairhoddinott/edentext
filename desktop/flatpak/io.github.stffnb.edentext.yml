# Submission draft for Flathub; once accepted, the flathub/io.github.stffnb.edentext
# repository is authoritative and its bot bumps the archives on every release.
id: io.github.stffnb.edentext
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: edentext
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: edentext
    buildsystem: simple
    build-commands:
      - cp -a edentext /app/
      # zypak-wrapper provides Chromium's sandbox; a setuid helper cannot work in Flatpak.
      - rm /app/edentext/chrome-sandbox
      - install -Dm755 edentext.sh /app/bin/edentext
      - install -Dm644 edentext/flatpak/io.github.stffnb.edentext.desktop -t /app/share/applications
      - install -Dm644 edentext/flatpak/io.github.stffnb.edentext.metainfo.xml -t /app/share/metainfo
      - install -Dm644 edentext/resources/app/icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.stffnb.edentext.png
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/stffnb/edentext/releases/download/v0.11.0/edentext-0.11.0.tar.gz
        sha256: 979797d101c28fffe5ee7a9e3d5ca646ff50ca72f8ecdf36514ec078ee96a567
        dest: edentext
        x-checker-data:
          type: json
          url: https://api.github.com/repos/stffnb/edentext/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "edentext-" + $version + ".tar.gz") | .browser_download_url
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/stffnb/edentext/releases/download/v0.11.0/edentext-0.11.0-arm64.tar.gz
        sha256: adcb4ec81a885a951ef476cdaa20d25cdd6d481535a51b978b8a8122108943f1
        dest: edentext
        x-checker-data:
          type: json
          url: https://api.github.com/repos/stffnb/edentext/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "edentext-" + $version + "-arm64.tar.gz") | .browser_download_url
      - type: script
        dest-filename: edentext.sh
        commands:
          - exec zypak-wrapper /app/edentext/edentext "$@"
